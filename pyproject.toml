[build-system]
requires = ["setuptools>=64", "wheel"]  # Remove setuptools-scm since you're using explicit version
build-backend = "setuptools.build_meta"

[project]
name = "forge-segmentation"
version = "0.1.0"
description = "Segmentation"
readme = "README.md"
authors = [
    {name = "ALS Photon Science Computing", email = "photon-science-computing@lbl.gov"}
]
requires-python = ">=3.11"

dependencies = [
    "sam3@git+https://github.com/facebookresearch/sam3.git",
    "einops",
    "decord",
    "pycocotools",
    "psutil",
    "timm>=1.0.17",
    "numpy>=1.26,<2",
    "tqdm",
    "ftfy==6.1.1",
    "regex",
    "iopath>=0.1.10",
    "typing_extensions",
    "dotenv",
    "qlty",
    "setuptools==70.3.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[tool.black]
line-length = 115